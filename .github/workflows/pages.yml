name: Publish public Memhub site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'scripts/export-public-site.mjs'
      - 'src/web-ui.ts'
      - 'docs/site/**'
      - 'web-assets/**'
      - 'package*.json'
      - 'tsconfig*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run site:check
      - run: node scripts/export-public-site.mjs ./_public-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_public-site
      - id: deployment
        uses: actions/deploy-pages@v4
