name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build headless core and gateway
        run: npm run build
      - name: Test
        run: npm test
      - name: Validate Linux installer syntax
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n Memhub/editions/local/linux/install.sh
          bash -n Memhub/editions/local/linux/uninstall.sh
          bash -n Memhub/editions/server/linux/install.sh
          bash -n Memhub/editions/server/linux/uninstall.sh
      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -Raw .\Memhub\editions\local\windows\install.ps1))
          [void][scriptblock]::Create((Get-Content -Raw .\Memhub\editions\local\windows\uninstall.ps1))
          [void][scriptblock]::Create((Get-Content -Raw .\Memhub\editions\server\windows\install.ps1))
          [void][scriptblock]::Create((Get-Content -Raw .\Memhub\editions\server\windows\uninstall.ps1))
