name: Repair release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild and replace
        required: true
        type: string

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip xz-utils file
      - name: Rebuild release assets from the rewritten tag
        run: node scripts/package-all-release.mjs --worktree
      - name: Replace generated release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" "release/$TAG"/* --repo "${{ github.repository }}" --clobber
