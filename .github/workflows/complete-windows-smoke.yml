name: Complete Windows smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip xz-utils file
      - name: Install dependencies
        run: npm ci
      - name: Build Windows Complete
        run: node scripts/package-complete-release.mjs --worktree --only windows --output-root complete-smoke
      - name: Upload Windows Complete
        uses: actions/upload-artifact@v4
        with:
          name: memhub-windows-complete-smoke
          path: complete-smoke/memhub-*-windows-complete.zip
          if-no-files-found: error
          retention-days: 1

  windows-runtime-smoke:
    needs: build-windows-complete
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: memhub-windows-complete-smoke
          path: ${{ runner.temp }}\memhub-complete-artifact
      - name: Run Complete package with bundled Node only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Wait-Port([int]$Port, [int]$Seconds = 30) {
            $deadline = (Get-Date).AddSeconds($Seconds)
            while ((Get-Date) -lt $deadline) {
              $client = New-Object System.Net.Sockets.TcpClient
              try {
                $iar = $client.BeginConnect('127.0.0.1', $Port, $null, $null)
                if ($iar.AsyncWaitHandle.WaitOne(500) -and $client.Connected) {
                  $client.EndConnect($iar)
                  return
                }
              } catch {} finally { $client.Dispose() }
              Start-Sleep -Milliseconds 500
            }
            throw "Port $Port did not become ready"
          }
          function Remove-TestTasks([string[]]$Names) {
            foreach ($name in $Names) {
              & cmd.exe /c "schtasks.exe /End /TN $name >NUL 2>&1" | Out-Null
              & cmd.exe /c "schtasks.exe /Delete /F /TN $name >NUL 2>&1" | Out-Null
            }
          }
          function Stop-TestMemhubProcesses([string]$InstallRoot) {
            $needle = $InstallRoot.ToLowerInvariant()
            Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue | ForEach-Object {
              $commandLine = [string]$_.CommandLine
              if ($commandLine -and $commandLine.ToLowerInvariant().Contains($needle)) {
                try { Stop-Process -Id $_.ProcessId -Force -ErrorAction Stop } catch {}
              }
            }
          }
          function Wait-PortClosed([int]$Port, [int]$Seconds = 20) {
            $deadline = (Get-Date).AddSeconds($Seconds)
            while ((Get-Date) -lt $deadline) {
              $client = New-Object System.Net.Sockets.TcpClient
              try {
                $iar = $client.BeginConnect('127.0.0.1', $Port, $null, $null)
                if (-not ($iar.AsyncWaitHandle.WaitOne(300) -and $client.Connected)) { return }
              } catch { return } finally { $client.Dispose() }
              Start-Sleep -Milliseconds 500
            }
            throw "Port $Port remained open after cleanup"
          }
          function Remove-PathWithRetry([string]$Path, [int]$Seconds = 20) {
            if (-not (Test-Path $Path)) { return }
            $deadline = (Get-Date).AddSeconds($Seconds)
            do {
              try {
                Remove-Item -Recurse -Force $Path -ErrorAction Stop
                return
              } catch {
                if ((Get-Date) -ge $deadline) { throw }
                Start-Sleep -Milliseconds 500
              }
            } while ($true)
          }

          $zip = Get-ChildItem "$env:RUNNER_TEMP\memhub-complete-artifact\memhub-*-windows-complete.zip" | Select-Object -First 1
          if (-not $zip) { throw "Windows Complete artifact missing" }
          $extract = Join-Path $env:RUNNER_TEMP 'memhub-complete-extract'
          Expand-Archive -Path $zip.FullName -DestinationPath $extract -Force
          $root = Get-ChildItem $extract -Directory | Where-Object { $_.Name -like 'memhub-*-windows-complete' } | Select-Object -First 1
          if (-not $root) { throw "Windows Complete root missing" }
          $node = Join-Path $root.FullName 'runtime\node\node.exe'
          if (-not (Test-Path $node)) { throw "Bundled node.exe missing" }
          & $node --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Node failed" }
          $env:NODE = ''
          $env:NPM = ''
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & (Join-Path $root.FullName 'install-complete.ps1') -PrepareOnly
          if ($LASTEXITCODE -ne 0) { throw "Complete prepare-only smoke failed" }

          $localState = Join-Path $env:RUNNER_TEMP 'memhub-complete-local-state'
          try {
            & (Join-Path $root.FullName 'install-complete.ps1') -Edition local -StateRoot $localState
            Wait-Port 18960
            Wait-Port 3001
            Wait-Port 17861
            $status = Invoke-RestMethod -Uri 'http://127.0.0.1:17861/status' -TimeoutSec 10
            if (-not $status) { throw 'Bridge status endpoint returned no data' }
            Write-Host '[memhub] Windows Complete Local install smoke PASS'
          } finally {
            Remove-TestTasks @('Memhub-Local-Stack','Memhub-Bridge','Memhub-Local','Memhub-Memory')
            Stop-TestMemhubProcesses $root.FullName
            Wait-PortClosed 17861
            Wait-PortClosed 3001
            Wait-PortClosed 18960
            Remove-PathWithRetry $localState
          }

          $serverState = Join-Path $env:RUNNER_TEMP 'memhub-complete-server-state'
          try {
            & (Join-Path $root.FullName 'install-complete.ps1') -Edition server -StateRoot $serverState -Username owner
            Wait-Port 18960
            Wait-Port 3001
            Write-Host '[memhub] Windows Complete Server install smoke PASS'
          } finally {
            Remove-TestTasks @('Memhub-Server-Stack','Memhub-Server','Memhub-Server-Memory')
            Stop-TestMemhubProcesses $root.FullName
            Wait-PortClosed 3001
            Wait-PortClosed 18960
            Remove-PathWithRetry $serverState
          }

          Remove-PathWithRetry $extract
